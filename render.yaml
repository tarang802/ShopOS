# Render Blueprint: deploys ShopOS as one web service built from the root Dockerfile.
#
#   Render dashboard -> New -> Blueprint -> pick this repository.
#
# You will be asked for MONGODB_URI (a MongoDB Atlas connection string; Atlas is a
# replica set, which ShopOS needs for transactions) and, optionally, GOOGLE_CLIENT_ID.
# The two JWT secrets are generated by Render and never leave it.
# Full walkthrough: docs/deployment.md.

services:
  - type: web
    name: shopos
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Singapore is Render's closest region to India.
    region: singapore
    # The free plan sleeps after 15 idle minutes and takes ~1 minute to wake, and the
    # hourly overdue reminders do not run while it sleeps. Use "starter" for a shop
    # that people actually work in.
    plan: free
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JOBS_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: info
