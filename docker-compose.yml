# ShopOS on one machine: MongoDB (as a replica set, which transactions need), the API,
# and the web app on http://localhost:8080.
#
#   cp deploy/.env.example .env      # then fill in the two secrets
#   docker compose up -d --build
#   docker compose --profile tools run --rm seed     # optional demo business
#
# For a real deployment put TLS in front of the web service. Browsers accept the
# production-only Secure cookie over plain http on localhost, but nowhere else.

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Starts the one-node replica set the first time, then reports healthy once it is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/shopos?replicaSet=rs0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env (openssl rand -hex 64)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env (openssl rand -hex 64)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    environment:
      API_UPSTREAM: api:4000
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      target: tools
    environment:
      MONGODB_URI: mongodb://mongo:27017/shopos?replicaSet=rs0
      JOBS_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
